name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Check release tag matches package version
        run: node -e "require('node:assert/strict').equal(process.env.RELEASE_TAG, 'v' + require('./package.json').version)"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm ci
      - id: package
        run: npm run test:package
        env:
          FUDE_KEEP_PACKAGE: '1'
      - name: Publish the tested tarball
        run: npm publish "$TARBALL" --ignore-scripts --provenance --access public --tag "$NPM_DIST_TAG"
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
