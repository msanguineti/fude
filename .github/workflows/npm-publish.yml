name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the release commit to be on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Validate version and release channel
        id: release
        run: node scripts/check-release.cjs
      - run: npm ci
      - id: package
        run: npm run test:package
        env:
          FUDE_KEEP_PACKAGE: '1'
      - name: Publish the tested tarball
        run: npm publish "$TARBALL" --ignore-scripts --provenance --access public --tag "$NPM_DIST_TAG"
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
