version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
    labels:
      - 'dependencies'
      - 'github_actions'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 2
    groups:
      development:
        patterns: ['*']
    labels:
      - 'dependencies'
      - 'npm'
